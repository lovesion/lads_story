name: Validate and index content
on:
  push:
    branches: [main]
    paths: ['content/**', 'scripts/**', 'schema/**']
  pull_request:
    branches: [main]
    paths: ['content/**', 'scripts/**', 'schema/**']
permissions: {contents: write}
jobs:
  validate-and-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/validate.py
      - run: python scripts/build_index.py
      - run: python scripts/validate.py
      - name: Commit regenerated index
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- metadata/index.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add metadata/index.json
          git commit -m 'chore: rebuild content index [skip ci]'
          git push
